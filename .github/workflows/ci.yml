name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  extension:
    name: extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --target wasm32-wasip2

  grammar:
    name: grammar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global tree-sitter-cli@0.26.12
      - name: Regenerate the parser
        run: make grammar
      - name: The committed parser must match grammar.js
        run: git diff --exit-code -- tree-sitter-verifpal/src
      - run: make test
      - run: make queries
