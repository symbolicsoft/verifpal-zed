name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  extension:
    name: extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --target wasm32-wasip2

  grammar:
    name: grammar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global tree-sitter-cli@0.26.12
      - name: Regenerate the parser
        run: make grammar
      - name: The committed parser must match grammar.js
        run: git diff --exit-code -- tree-sitter-verifpal/src
      - run: make test
      - run: make queries

  integration:
    name: integration (verifpal from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global tree-sitter-cli@0.26.12
      - uses: dtolnay/rust-toolchain@stable
      - name: Build verifpal
        run: |
          git clone --depth 1 https://github.com/symbolicsoft/verifpal.git "$RUNNER_TEMP/verifpal"
          cargo build --release --manifest-path "$RUNNER_TEMP/verifpal/Cargo.toml"
      - name: The grammar must parse every shipped model
        run: VERIFPAL_EXAMPLES="$RUNNER_TEMP/verifpal/examples" make conformance
      - name: The language server must answer what the extension relies on
        run: VERIFPAL_BIN="$RUNNER_TEMP/verifpal/target/release/verifpal" make lsp-test
